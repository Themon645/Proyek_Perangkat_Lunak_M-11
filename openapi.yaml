openapi: 3.0.3
info:
  title: M11 Procurement API
  description: API Purchase Order, Goods Receipt, dan pelunasan tagihan supplier (Araya Hub BPU Universitas Pasundan) terintegrasi Vercel Serverless Function & PostgreSQL (Neon Cloud).
  version: 1.2.0

servers:
  - url: https://proyek-perangkat-lunak-m-11.vercel.app
    description: Production Serverless (Vercel Cloud)
  - url: http://localhost:8080
    description: Local Standalone Server

tags:
  - name: Purchase Orders
    description: Manajemen pengadaan barang dan siklus status PO
  - name: Goods Receipts
    description: Pencatatan penerimaan barang fisik (GRN) dan surat jalan
  - name: Reports
    description: Agregasi data belanja dan pelaporan pengadaan
  - name: Storage
    description: Layanan berkas statis dan bukti pembayaran
  - name: System
    description: Monitoring kesehatan serverless dan utilitas database

paths:
  /:
    get:
      tags: [System]
      summary: Root health & welcome info
      description: Mengembalikan pesan sambutan dan daftar endpoint yang tersedia di runtime Vercel.
      responses:
        '200':
          description: Serverless function aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: M11 Procurement API Serverless on Vercel is online
                  database:
                    type: string
                    example: PostgreSQL (Neon)
                  endpoints:
                    type: array
                    items:
                      type: string

  /health:
    get:
      tags: [System]
      summary: Health check serverless & database
      description: Memeriksa kesiapan runtime serverless dan status koneksi database (PostgreSQL Neon).
      responses:
        '200':
          description: Status kesehatan sistem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      serverless:
                        type: string
                        example: running
                      postgres:
                        type: string
                        example: connected (Neon)

  /database/reset-and-seed:
    post:
      tags: [System]
      summary: Reset & seed MongoDB Atlas
      description: Menghapus data lama dan menginisialisasi 10 Purchase Order serta 10 Goods Receipt bersih dengan alur pengadaan yang realistis.
      responses:
        '200':
          description: Database berhasil direset dan di-seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: MongoDB berhasil dibersihkan dan diisi 10 purchase orders & goods receipts bersih
        '500':
          $ref: '#/components/responses/ServerError'

  /purchase-orders:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan seluruh daftar purchase order
      description: Mengembalikan daftar seluruh PO terurut dari yang terbaru, termasuk rincian item, kuantitas diterima, dan total biaya.
      responses:
        '200':
          description: Daftar purchase order berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Purchase Orders]
      summary: Membuat purchase order baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
            example:
              id: PO-2026-001
              supplier: PT Graha Sarana Mitra
              status: approved
              items:
                - id: ITEM-101
                  name: Kertas HVS A4 80gr Sinar Dunia
                  quantity: 100
                  unit_cost: 65000
      responses:
        '201':
          description: Purchase order berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan detail purchase order berdasarkan ID
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '200':
          description: Detail purchase order ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /purchase-orders/{id}/receipts:
    get:
      tags: [Goods Receipts]
      summary: Mendapatkan riwayat penerimaan purchase order (Multi-Receipt)
      description: Mengembalikan seluruh tahap penerimaan (surat jalan) per tanggal dengan rincian penerima, catatan, dan item yang diterima.
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '200':
          description: Riwayat penerimaan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceiptHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Purchase Orders]
      summary: Mencatat penerimaan barang langsung ke purchase order (Legacy)
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePurchaseOrderRequest'
            example:
              items:
                - id: ITEM-101
                  quantity: 50
      responses:
        '200':
          description: Penerimaan barang berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}/payment:
    post:
      tags: [Purchase Orders]
      summary: Mencatat pelunasan tagihan purchase order
      description: Mengunggah berkas bukti transfer fisik (PDF/JPG/PNG maks 5 MB) atau referensi bukti, kemudian memperbarui status pembayaran PO menjadi `paid`.
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
                  description: Berkas bukti transfer (PDF, JPG, atau PNG); maksimal 5 MB.
          application/json:
            schema:
              $ref: '#/components/schemas/PayPurchaseOrderRequest'
            example:
              proof: storage/payment-proofs/bukti-transfer-mandiri.pdf
      responses:
        '200':
          description: Pembayaran berhasil diverifikasi dan dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/approved:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan daftar purchase order yang berstatus disetujui (approved)
      description: Mengembalikan seluruh PO dengan status `approved` yang siap untuk diproses penerimaan barangnya (GRN).
      responses:
        '200':
          description: Daftar purchase order yang telah disetujui
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
        '500':
          $ref: '#/components/responses/ServerError'

  /purchase-orders/unpaid:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan daftar purchase order yang belum lunas
      responses:
        '200':
          description: Daftar tagihan belum lunas dan total nilai akumulasi
          content:
            application/json:
              schema:
                type: object
                required: [purchase_orders, total]
                properties:
                  purchase_orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnpaidPurchaseOrder'
                  total:
                    type: integer
                    format: int64
                    example: 6500000

  /goods-receipts:
    post:
      tags: [Goods Receipts]
      summary: Membuat goods receipt baru (GRN)
      description: Menyimpan dokumen penerimaan surat jalan, memvalidasi kuantitas terhadap sisa pesanan, dan memperbarui status PO secara atomik (`received partial` atau `received`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoodsReceiptRequest'
            example:
              purchase_order_id: PO-2026-001
              receipt_no: SJ-2026/X/9812
              received_date: '2026-11-09'
              receiver: Petugas Gudang
              notes: Barang diterima dalam kondisi baik
              items:
                - item_id: ITEM-101
                  qty_received: 50
      responses:
        '201':
          description: Goods receipt berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /reports/procurement:
    get:
      tags: [Reports]
      summary: Mendapatkan rekap laporan pengadaan
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-30'
      responses:
        '200':
          description: Laporan pengadaan per vendor
          content:
            application/json:
              schema:
                type: object
                required: [from, to, suppliers]
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  suppliers:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /storage/payment-proofs/{filename}:
    get:
      tags: [Storage]
      summary: Mengunduh atau melihat berkas bukti transfer
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: 9e32fba176c12814d45.pdf
      responses:
        '200':
          description: Berkas bukti transfer
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    PurchaseOrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: PO-2026-001

  schemas:
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          example: PO-2026-001
        supplier:
          type: string
          example: PT Graha Sarana Mitra
        status:
          type: string
          example: received partial
          enum: [submitted, approved, received partial, received, rejected]
        payment:
          type: string
          example: unpaid
          enum: [unpaid, paid]
        proof:
          type: string
          example: storage/payment-proofs/e84cb2176a91.pdf
        total:
          type: integer
          format: int64
          example: 6500000
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'

    PurchaseOrderItem:
      type: object
      properties:
        id:
          type: string
          example: ITEM-101
        name:
          type: string
          example: Kertas HVS A4 80gr Sinar Dunia
        quantity:
          type: integer
          example: 100
        unit_cost:
          type: integer
          format: int64
          example: 65000
        qty_received:
          type: integer
          example: 50

    CreatePurchaseOrderRequest:
      type: object
      required: [supplier, items]
      properties:
        id:
          type: string
          example: PO-2026-001
        supplier:
          type: string
          example: PT Graha Sarana Mitra
        status:
          type: string
          example: approved
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreatePurchaseOrderItem'

    CreatePurchaseOrderItem:
      type: object
      required: [id, quantity, unit_cost]
      properties:
        id:
          type: string
          example: ITEM-101
        name:
          type: string
          example: Kertas HVS A4 80gr Sinar Dunia
        quantity:
          type: integer
          minimum: 1
          example: 100
        unit_cost:
          type: integer
          format: int64
          minimum: 0
          example: 65000

    ReceivePurchaseOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity]
            properties:
              id:
                type: string
                example: ITEM-101
              quantity:
                type: integer
                minimum: 1
                example: 50

    PayPurchaseOrderRequest:
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          minLength: 1
          example: storage/payment-proofs/bukti-transfer-2026.pdf

    CreateGoodsReceiptRequest:
      type: object
      required: [purchase_order_id, receipt_no, received_date, items]
      properties:
        purchase_order_id:
          type: string
          example: PO-2026-001
        receipt_no:
          type: string
          example: SJ-2026/X/9812
        received_date:
          type: string
          format: date
          example: '2026-11-09'
        receiver:
          type: string
          example: Petugas Gudang
        notes:
          type: string
          example: Barang diterima dalam kondisi baik
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_id, qty_received]
            properties:
              item_id:
                type: string
                example: ITEM-101
              qty_received:
                type: integer
                minimum: 1
                example: 50

    GoodsReceipt:
      type: object
      properties:
        receipt_no:
          type: string
          example: SJ-2026/X/9812
        purchase_order_id:
          type: string
          example: PO-2026-001
        received_date:
          type: string
          format: date-time
        receiver:
          type: string
          example: Petugas Gudang
        notes:
          type: string
          example: Barang diterima dalam kondisi baik
        items:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceiptItem'

    GoodsReceiptItem:
      type: object
      properties:
        id:
          type: string
          example: GRN-ITEM-001
        receipt_no:
          type: string
          example: SJ-2026/X/9812
        item_id:
          type: string
          example: ITEM-101
        qty_received:
          type: integer
          example: 50

    GoodsReceiptHistory:
      type: object
      required: [purchase_order_id, receipts]
      properties:
        purchase_order_id:
          type: string
          example: PO-2026-001
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceiptHistoryEntry'

    GoodsReceiptHistoryEntry:
      type: object
      required: [receipt_no, received_date, receiver, items]
      properties:
        receipt_no:
          type: string
          example: SJ-2026/X/9812
        received_date:
          type: string
          format: date
          example: '2026-11-09'
        receiver:
          type: string
          example: Petugas Gudang
        notes:
          type: string
          example: Barang diterima dalam kondisi baik
        items:
          type: array
          items:
            type: object
            required: [item_id, item_name, qty_received]
            properties:
              item_id:
                type: string
                example: ITEM-101
              item_name:
                type: string
                example: Kertas HVS A4 80gr Sinar Dunia
              qty_received:
                type: integer
                example: 50

    UnpaidPurchaseOrder:
      type: object
      properties:
        id:
          type: string
          example: PO-2026-001
        supplier:
          type: string
          example: PT Graha Sarana Mitra
        total:
          type: integer
          format: int64
          example: 6500000

    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid input

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Input tidak lolos validasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflik status atau data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
