openapi: 3.0.3
info:
  title: M11 Procurement API
  description: >
    API Manajemen Pengadaan Barang (Purchase Order), Penerimaan Barang Fisik (Goods Receipt Note / GRN),
    dan Pelunasan Tagihan Supplier dengan SOP Three-Way Matching (Araya Business Hub BPU Universitas Pasundan).
    Terintegrasi Vercel Serverless Function, basis data cloud PostgreSQL (Neon Cloud Pooler), dan Neon S3 Object Storage.
  version: 1.3.0

servers:
  - url: https://proyek-perangkat-lunak-m-11.vercel.app
    description: Production Serverless (Vercel Cloud)
  - url: http://localhost:8080
    description: Local Standalone Server

tags:
  - name: Purchase Orders
    description: Manajemen pengadaan barang, siklus status PO, dan pelunasan tagihan supplier
  - name: Goods Receipts
    description: Pencatatan penerimaan fisik barang (GRN), verifikasi surat jalan, dan split shipment
  - name: Reports
    description: Rekapitulasi belanja dan pelaporan pengadaan per vendor
  - name: Storage
    description: Unduh dan pratinjau berkas bukti bayar transfer (Neon S3 Object Storage)
  - name: System
    description: Health check serverless dan utilitas reset/seed basis data

paths:
  /:
    get:
      tags: [System]
      summary: Root health & welcome info
      description: Mengembalikan pesan sambutan dan daftar endpoint aktif pada runtime serverless.
      responses:
        '200':
          description: Serverless function aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: M11 Procurement API Serverless on Vercel is online
                  database:
                    type: string
                    example: PostgreSQL (Neon)
                  endpoints:
                    type: array
                    items:
                      type: string

  /health:
    get:
      tags: [System]
      summary: Health check serverless & database
      description: Memeriksa kesiapan runtime serverless dan koneksi ke PostgreSQL Neon.
      responses:
        '200':
          description: Status kesehatan sistem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      serverless:
                        type: string
                        example: running
                      postgres:
                        type: string
                        example: connected (Neon)

  /database/reset-and-seed:
    post:
      tags: [System]
      summary: Reset & seed PostgreSQL (Neon Cloud)
      description: >
        Membersihkan seluruh data tabel transaksi pengadaan dan menginisialisasi 20 Purchase Order multi-item (41 items),
        10 dokumen GRN (20 item masuk), dan 5 bukti pelunasan dengan variasi status realistis.
      responses:
        '200':
          description: Database berhasil direset dan diisi data seeder baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: PostgreSQL (Neon) berhasil dibersihkan dan diisi 20 purchase orders multi-item & goods receipts
        '500':
          $ref: '#/components/responses/ServerError'

  /purchase-orders:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan seluruh daftar purchase order (mendukung filter & pencarian)
      description: >
        Mengembalikan daftar purchase order terurut dari yang terlama dibuat (ASC).
        Secara default mengembalikan seluruh 10 PO (semua status: approved, pending, received partial, received).
        Mendukung filter status spesifik, pengecualian status (selain disetujui), filter tanggal, dan pencarian global.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter status PO: `approved`, `received partial`, `received`, `pending`.
            Bisa menggunakan `selain-disetujui`, `non-approved`, atau `!approved` untuk memunculkan status selain disetujui.
          example: selain-disetujui
        - name: exclude_status
          in: query
          required: false
          schema:
            type: string
          description: Mengecualikan status tertentu (contoh `approved`).
          example: approved
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal terbit PO (format YYYY-MM-DD).
          example: '2026-11-10'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Batas awal tanggal terbit PO.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Batas akhir tanggal terbit PO.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Pencarian teks pada ID PO atau Nama Supplier (case-insensitive).
          example: Mitra
      responses:
        '200':
          description: Daftar purchase order berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Purchase Orders]
      summary: Membuat purchase order baru (Multi-Item)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
            example:
              id: PO-2026-001
              supplier: PT Graha Sarana Mitra
              status: approved
              items:
                - id: ITEM-101
                  name: Kertas HVS A4 80gr Sinar Dunia
                  quantity: 100
                  unit_cost: 65000
                - id: ITEM-101-B
                  name: Map Odner Bantex Folio 7cm
                  quantity: 50
                  unit_cost: 35000
      responses:
        '201':
          description: Purchase order berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan detail purchase order berdasarkan ID
      description: Mengembalikan detail lengkap satu PO, seluruh daftar barang pesanan, data pelunasan (tanggal bayar, bank, bukti bayar), dan tautan unduh.
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '200':
          description: Detail purchase order ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /purchase-orders/{id}/receipts:
    get:
      tags: [Goods Receipts]
      summary: Mendapatkan riwayat penerimaan barang per PO (Multi-Receipt)
      description: Mengembalikan seluruh tahap penerimaan surat jalan (GRN) pada nomor PO tersebut.
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '200':
          description: Riwayat penerimaan berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceiptHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Purchase Orders]
      summary: Mencatat penerimaan barang langsung ke purchase order (Legacy)
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePurchaseOrderRequest'
      responses:
        '200':
          description: Penerimaan barang berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}/payment:
    post:
      tags: [Purchase Orders]
      summary: Mencatat pelunasan tagihan supplier (Three-Way Matching SOP)
      description: >
        Memproses pelunasan faktur tagihan PO ke vendor.
        Sesuai SOP Three-Way Matching BPU, pelunasan HANYA DIIZINKAN jika barang pesanan sudah 100% lengkap diterima di gudang (`status: received`).
        Jika PO masih `received partial` atau `approved`, permintaan ditolak dengan kode `PO_NOT_FULLY_RECEIVED` (422).
        Mendukung unggahan file bukti transfer fisik (multipart/form-data) atau URL bukti S3 (application/json).
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
                  description: Berkas bukti transfer (PDF, JPG, atau PNG); maksimal 5 MB.
                bank:
                  type: string
                  description: Nama bank tujuan transfer vendor.
                  example: Bank Mandiri (1310-0982-4412 a.n. Vendor)
                paid_at:
                  type: string
                  format: date
                  description: Tanggal pembayaran dilakukan (tidak boleh masa depan atau sebelum tanggal PO).
                  example: '2026-11-13'
          application/json:
            schema:
              $ref: '#/components/schemas/PayPurchaseOrderRequest'
            example:
              proof: https://br-steep-truth-aoy56eud.storage.c-2.ap-southeast-1.aws.neon.tech/payment-proofs/sample-receipt.pdf
              bank: Bank Mandiri (1310-0982-4412 a.n. Vendor)
              paid_at: '2026-11-13'
      responses:
        '200':
          description: Pembayaran berhasil diverifikasi dan dicatat (Status PO berubah menjadi paid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          description: Tanggal bayar tidak valid (di masa depan / backdated) atau format bukti bayar salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PO sudah berstatus lunas sebelumnya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Barang pesanan belum 100% diterima (PO masih received partial / approved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /purchase-orders/{id}/proof:
    get:
      tags: [Storage]
      summary: Mengunduh / membuka berkas bukti pelunasan PO
      description: Mengembalikan HTTP redirect 302 Found ke tautan dokumen resmi bukti pembayaran di Neon S3 Object Storage.
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        '302':
          description: Redirect ke berkas dokumen bukti pembayaran di Cloud Storage
          headers:
            Location:
              schema:
                type: string
              description: URL dokumen bukti bayar di Neon S3
        '404':
          description: Bukti pembayaran belum diunggah atau PO tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /storage/payment-proofs/{filename}:
    get:
      tags: [Storage]
      summary: Direct file serving bukti transfer
      description: Endpoint statis untuk mengunduh bukti transfer berdasarkan nama berkas via HTTP 302 redirect ke Neon S3.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: sample-receipt.pdf
      responses:
        '302':
          description: Redirect ke file di S3
        '404':
          $ref: '#/components/responses/NotFound'

  /purchase-orders/approved:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan daftar PO yang siap dicatat penerimaan barangnya (GRN Dropdown)
      description: Mengembalikan seluruh PO dengan status `approved` DAN `received partial` yang masih memiliki sisa barang yang perlu diterima di gudang.
      responses:
        '200':
          description: Daftar purchase order yang siap dicatat GRN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
        '500':
          $ref: '#/components/responses/ServerError'

  /purchase-orders/unpaid:
    get:
      tags: [Purchase Orders]
      summary: Mendapatkan daftar tagihan siap bayar (Three-Way Matching)
      description: >
        Mengembalikan daftar PO yang belum dibayar (`payment: unpaid`) DAN barangnya sudah 100% lengkap diterima di gudang (`status: received`).
        PO yang masih berstatus `received partial` secara ketat tidak disertakan.
      responses:
        '200':
          description: Daftar tagihan siap bayar dan akumulasi total nominal
          content:
            application/json:
              schema:
                type: object
                required: [purchase_orders, total]
                properties:
                  purchase_orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnpaidPurchaseOrder'
                  total:
                    type: integer
                    format: int64
                    example: 6500000

  /goods-receipts:
    get:
      tags: [Goods Receipts]
      summary: Mendapatkan seluruh riwayat Goods Receipt Note (GRN) terpadu
      description: Mengembalikan seluruh dokumen surat jalan penerimaan barang dari seluruh PO di gudang. Mendukung filter PO, tanggal, dan pencarian.
      parameters:
        - in: query
          name: purchase_order_id
          required: false
          schema:
            type: string
          description: Filter data goods receipt berdasarkan nomor ID Purchase Order
        - in: query
          name: po
          required: false
          schema:
            type: string
          description: Alias filter nomor ID Purchase Order
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: Filter tanggal penerimaan (YYYY-MM-DD)
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Pencarian kata kunci nomor surat jalan, penerima, atau PO
      responses:
        '200':
          description: Riwayat dokumen GRN global berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      goods_receipts:
                        type: array
                        items:
                          $ref: '#/components/schemas/GoodsReceiptResponse'
    post:
      tags: [Goods Receipts]
      summary: Mencatat penerimaan barang fisik baru (GRN / Surat Jalan)
      description: >
        Menyimpan dokumen penerimaan barang fisik dari vendor.
        Validasi: nomor surat jalan maksimal 20 karakter, kuantitas bilangan bulat integer non-negatif,
        tanggal diterima tidak boleh di masa depan dan tidak boleh sebelum tanggal PO dibuat,
        serta catatan inspeksi otomatis disanitasi dari injeksi skrip XSS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoodsReceiptRequest'
            example:
              purchase_order_id: PO-2026-001
              receipt_no: SJ-2026/X/9812
              received_date: '2026-11-12'
              receiver: Tyezar Hasan (Staff Gudang)
              notes: Barang dalam kondisi baik dan tersegel utuh
              items:
                - item_id: ITEM-101
                  qty_received: 50
                - item_id: ITEM-101-B
                  qty_received: 25
      responses:
        '201':
          description: Dokumen GRN berhasil dicatat dan status PO diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Validasi gagal (Kuantitas desimal, Surat Jalan > 20 char, Qty melebihi sisa, atau Tanggal tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /goods-receipt:
    get:
      tags: [Goods Receipts]
      summary: Alias endpoint GET /goods-receipts
      description: Alias singular rute untuk kompatibilitas integrasi Frontend.
      responses:
        '200':
          description: Daftar goods receipt berhasil diambil
    post:
      tags: [Goods Receipts]
      summary: Alias endpoint POST /goods-receipts
      description: Alias singular rute untuk pencatatan GRN.
      requestBody:
        $ref: '#/paths/~1goods-receipts/post/requestBody'
      responses:
        '201':
          description: Dokumen GRN berhasil dicatat

  /reports/procurement:
    get:
      tags: [Reports]
      summary: Mendapatkan rekapitulasi laporan pengadaan belanja per vendor
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-30'
      responses:
        '200':
          description: Laporan pengadaan per vendor
          content:
            application/json:
              schema:
                type: object
                required: [from, to, suppliers]
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  suppliers:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    PurchaseOrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: PO-2026-001

  schemas:
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          example: PO-2026-001
        nomor_po:
          type: string
          example: PO-2026-001
        supplier:
          type: string
          example: PT Graha Sarana Mitra
        supplier_name:
          type: string
          example: PT Graha Sarana Mitra
        status:
          type: string
          example: received partial
          enum: [pending, approved, received partial, received, rejected]
        payment:
          type: string
          example: unpaid
          enum: [unpaid, paid]
        order_date:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        received_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-12T10:15:00Z'
        paid_at:
          type: string
          format: date
          nullable: true
          example: '2026-11-13'
        tanggal_bayar:
          type: string
          format: date
          nullable: true
          example: '2026-11-13'
        bank:
          type: string
          nullable: true
          example: Bank Mandiri (1310-0982-4412 a.n. Vendor)
        bank_tujuan:
          type: string
          nullable: true
          example: Bank Mandiri (1310-0982-4412 a.n. Vendor)
        proof:
          type: string
          nullable: true
          example: https://br-steep-truth-aoy56eud.storage.c-2.ap-southeast-1.aws.neon.tech/payment-proofs/sample-receipt.pdf
        proof_url:
          type: string
          nullable: true
          example: https://proyek-perangkat-lunak-m-11.vercel.app/purchase-orders/PO-2026-002/proof
        attachment_url:
          type: string
          nullable: true
          example: https://proyek-perangkat-lunak-m-11.vercel.app/purchase-orders/PO-2026-002/proof
        total:
          type: integer
          format: int64
          example: 8250000
        total_tagihan:
          type: integer
          format: int64
          example: 8250000
        items:
          type: array
          description: Daftar seluruh rincian barang (mendukung multi-item)
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'

    PurchaseOrderItem:
      type: object
      properties:
        id:
          type: string
          example: ITEM-101
        item_id:
          type: string
          example: ITEM-101
        name:
          type: string
          example: Kertas HVS A4 80gr Sinar Dunia
        item_name:
          type: string
          example: Kertas HVS A4 80gr Sinar Dunia
        quantity:
          type: integer
          example: 100
        unit_cost:
          type: integer
          format: int64
          example: 65000
        qty_received:
          type: integer
          example: 50
        received:
          type: integer
          example: 50
        remaining:
          type: integer
          example: 50
        unit:
          type: string
          example: Unit

    CreatePurchaseOrderRequest:
      type: object
      required: [supplier, items]
      properties:
        id:
          type: string
          example: PO-2026-001
        supplier:
          type: string
          example: PT Graha Sarana Mitra
        status:
          type: string
          example: approved
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreatePurchaseOrderItem'

    CreatePurchaseOrderItem:
      type: object
      required: [id, quantity, unit_cost]
      properties:
        id:
          type: string
          example: ITEM-101
        name:
          type: string
          example: Kertas HVS A4 80gr Sinar Dunia
        quantity:
          type: integer
          minimum: 1
          example: 100
        unit_cost:
          type: integer
          format: int64
          minimum: 0
          example: 65000

    ReceivePurchaseOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity]
            properties:
              id:
                type: string
                example: ITEM-101
              quantity:
                type: integer
                minimum: 1
                example: 50

    PayPurchaseOrderRequest:
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          minLength: 1
          description: URL atau nama file bukti transfer pembayaran
          example: https://br-steep-truth-aoy56eud.storage.c-2.ap-southeast-1.aws.neon.tech/payment-proofs/sample-receipt.pdf
        bank:
          type: string
          description: Nama bank tujuan pembayaran
          example: Bank Mandiri (1310-0982-4412 a.n. Vendor)
        paid_at:
          type: string
          format: date
          description: Tanggal pembayaran dilakukan (maksimal hari ini, tidak boleh sebelum PO)
          example: '2026-11-13'

    CreateGoodsReceiptRequest:
      type: object
      required: [purchase_order_id, receipt_no, received_date, items]
      properties:
        purchase_order_id:
          type: string
          example: PO-2026-001
        receipt_no:
          type: string
          maxLength: 20
          description: Nomor Surat Jalan dari vendor (maksimal 20 karakter)
          example: SJ-2026/X/9812
        received_date:
          type: string
          format: date
          description: Tanggal fisik barang tiba (maksimal hari ini, tidak boleh sebelum tanggal PO)
          example: '2026-11-12'
        receiver:
          type: string
          description: Nama staf/petugas pemeriksa gudang
          example: Tyezar Hasan (Staff Gudang)
        notes:
          type: string
          description: Catatan hasil inspeksi kondisi barang (sanitasi XSS aktif)
          example: Barang diterima dalam kondisi baik dan tersegel utuh
        items:
          type: array
          minItems: 1
          description: Rincian barang fisik yang diterima pada sesi ini
          items:
            type: object
            required: [item_id, qty_received]
            properties:
              item_id:
                type: string
                example: ITEM-101
              qty_received:
                type: integer
                minimum: 1
                description: Kuantitas barang fisik (wajib bilangan bulat integer non-negatif)
                example: 50

    GoodsReceipt:
      type: object
      properties:
        id:
          type: string
          example: SJ-2026/X/9812
        receipt_no:
          type: string
          example: SJ-2026/X/9812
